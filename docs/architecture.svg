      <text x="372" y="28" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#0f172a">Dual-Wavelength Passivation</text>
      <text x="372" y="55" text-anchor="middle" font-family="Arial" font-size="13" fill="#475569">Vacate occupied defect site</text>
      <text x="372" y="77" text-anchor="middle" font-family="Arial" font-size="13" fill="#475569">Deliver oxygen donor</text>
