      <text x="637" y="28" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#0f172a">Inline Closed Loop</text>
      <text x="637" y="55" text-anchor="middle" font-family="Arial" font-size="13" fill="#475569">Spectral feedforward</text>
      <text x="637" y="77" text-anchor="middle" font-family="Arial" font-size="13" fill="#475569">Endpoint + damage feedback</text>
      <text x="637" y="99" text-anchor="middle" font-family="Arial" font-size="13" fill="#475569">Spatial correction</text>
