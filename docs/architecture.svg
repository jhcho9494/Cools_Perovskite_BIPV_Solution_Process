      <text x="392" y="51" text-anchor="middle" font-family="Arial" font-size="13" fill="#475569">Coating +</text>
      <text x="392" y="70" text-anchor="middle" font-family="Arial" font-size="13" fill="#475569">Vertical Growth</text>

      <line x1="455" y1="45" x2="485" y2="45" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
