      <text x="62" y="72" text-anchor="middle" font-family="Arial" font-size="13" fill="#475569">Optical Layers</text>

      <line x1="125" y1="45" x2="155" y2="45" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
