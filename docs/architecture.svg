      <text x="107" y="77" text-anchor="middle" font-family="Arial" font-size="13" fill="#475569">Coordinated solvent removal</text>
      <text x="107" y="99" text-anchor="middle" font-family="Arial" font-size="13" fill="#475569">Phase conversion</text>

